<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="dark light" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<title>Haven</title>
		<script>
			(function() {
				// The theme / accent persist in localStorage (frontend-only), so
				// they can be applied synchronously on this blocking script and
				// the first paint is always correct — no wait for get_settings.
				function read(k) {
					try { return window.localStorage.getItem(k); } catch (e) { return null; }
				}
				var theme = read('haven.theme');
				if (theme !== 'light' && theme !== 'dark') {
					theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
				}
				document.documentElement.setAttribute('data-theme', theme);
				var accent = read('haven.accent');
				// Preset hexes are mirrored from themeStore.ts's ACCENT_PRESETS —
				// keep this table in sync when adding/renaming presets.
				var hex = '#2C5090'; /* info蓝 default */
				if (accent === 'green') hex = '#006548';
				else if (accent === 'red') hex = '#C82910';
				else if (accent && accent.indexOf('custom:') === 0) {
					var c = accent.slice(7);
					if (/^#[0-9a-f]{6}$/i.test(c)) hex = c;
				}
				document.documentElement.setAttribute('data-accent', accent || 'blue');
				document.documentElement.style.setProperty('--md-accent-hex', hex);
				// Match tauri.conf backgroundColor so the boot shell and the
				// pre-HTML webview rectangle share one surface color.
				document.documentElement.style.background =
					theme === 'light' ? '#f7f6fa' : '#121318';
			})();
		</script>
		<style>
			/* First-paint boot shell: no external CSS, paints before Svelte hydrates. */
			html, body {
				margin: 0;
				height: 100%;
				background: #121318;
				color: #e3e2e6;
			}
			html[data-theme="light"], html[data-theme="light"] body {
				background: #f7f6fa;
				color: #1b1b1f;
			}
			#haven-boot {
				position: fixed;
				inset: 0;
				z-index: 9999;
				display: flex;
				flex-direction: column;
				background: inherit;
				color: inherit;
				font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
				-webkit-font-smoothing: antialiased;
			}
			#haven-boot .boot-bar {
				height: 48px;
				display: flex;
				align-items: center;
				justify-content: space-between;
				padding: 0 14px;
				border-bottom: 1px solid rgba(127, 127, 127, 0.28);
				-webkit-app-region: drag;
				flex-shrink: 0;
			}
			#haven-boot .boot-brand {
				font-weight: 600;
				letter-spacing: 0.02em;
				font-size: 15px;
			}
			#haven-boot .boot-chip {
				display: inline-flex;
				align-items: center;
				gap: 6px;
				font-size: 12px;
				opacity: 0.75;
				-webkit-app-region: no-drag;
			}
			#haven-boot .boot-main {
				flex: 1;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 14px;
				padding: 24px;
			}
			#haven-boot .boot-spinner {
				width: 28px;
				height: 28px;
				border-radius: 50%;
				border: 2.5px solid rgba(127, 127, 127, 0.28);
				border-top-color: var(--md-accent-hex, #2C5090);
				animation: haven-boot-spin 0.75s linear infinite;
			}
			#haven-boot .boot-msg {
				font-size: 13px;
				opacity: 0.7;
			}
			@keyframes haven-boot-spin {
				to { transform: rotate(360deg); }
			}
		</style>
		%sveltekit.head%
	</head>
	<body>
		<!-- Instant shell: visible as soon as HTML parses, before JS hydrates.
		     Removed by +layout.svelte onMount once the real chrome is live. -->
		<div id="haven-boot" role="status" aria-live="polite" aria-busy="true">
			<div class="boot-bar">
				<span class="boot-brand">Haven</span>
				<span class="boot-chip">
					<span class="boot-spinner" style="width:12px;height:12px;border-width:2px;" aria-hidden="true"></span>
					加载中
				</span>
			</div>
			<div class="boot-main">
				<div class="boot-spinner" aria-hidden="true"></div>
				<div class="boot-msg">正在启动…</div>
			</div>
		</div>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
