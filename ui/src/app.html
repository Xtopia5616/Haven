<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="dark light" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<link
			rel="preload"
			href="%sveltekit.assets%/fonts/roboto/latin-400-normal.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<link
			rel="preload"
			href="%sveltekit.assets%/fonts/jetbrains-mono/latin-400-normal.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<title>Haven</title>
		<script>
			(function () {
				// Apply persisted theme and accent before the first paint so the
				// loading surface matches the hydrated app.
				function read(k) {
					try {
						return window.localStorage.getItem(k);
					} catch (e) {
						return null;
					}
				}
				var theme = read('haven.theme');
				if (theme !== 'light' && theme !== 'dark') {
					theme = window.matchMedia('(prefers-color-scheme: dark)').matches
						? 'dark'
						: 'light';
				}
				document.documentElement.setAttribute('data-theme', theme);
				var accent = read('haven.accent');
				// Preset hexes are mirrored from themeStore.ts's ACCENT_PRESETS —
				// keep this table in sync when adding/renaming presets.
				var hex = '#2C5090'; /* info蓝 default */
				if (accent === 'green') hex = '#006548';
				else if (accent === 'red') hex = '#C82910';
				else if (accent && accent.indexOf('custom:') === 0) {
					var c = accent.slice(7);
					if (/^#[0-9a-f]{6}$/i.test(c)) hex = c;
					else accent = 'blue';
				} else if (accent !== 'blue') {
					accent = 'blue';
				}
				document.documentElement.setAttribute('data-accent', accent || 'blue');
				document.documentElement.style.setProperty('--md-accent-hex', hex);
			})();
		</script>
		<style>
			:root,
			[data-theme='light'],
			[data-theme='dark'] {
				/* Keep the pre-hydration content boundary aligned with AppShell. */
				--md-comp-titlebar-height: 56px;
				--md-comp-tab-container-height: 56px;
			}
			:root,
			[data-theme='light'] {
				--md-sys-color-background: #f6f8fb;
				--md-sys-color-on-background: #202b3c;
				--md-sys-color-primary: var(--md-accent-hex, #2c5090);
			}
			[data-theme='dark'] {
				--md-sys-color-background: #171c24;
				--md-sys-color-on-background: #e5ebf3;
				--md-sys-color-on-primary: #000000;
				--md-sys-color-primary: color-mix(
					in srgb,
					var(--md-accent-hex, #2c5090) 55%,
					#ffffff
				);
			}
			html,
			body {
				margin: 0;
				height: 100%;
				background: var(--md-sys-color-background);
			}
			#haven-boot {
				position: fixed;
				/* The first-paint loader covers the whole window; later page loading
				   states stay inside their own workspace. */
				inset: 0;
				z-index: 9999;
				display: grid;
				place-items: center;
				background: var(--md-sys-color-background);
				-webkit-font-smoothing: antialiased;
			}
			#haven-boot-error {
				width: min(440px, calc(100vw - 48px));
				box-sizing: border-box;
				padding: 28px;
				border: 1px solid color-mix(in srgb, var(--md-sys-color-primary) 24%, transparent);
				border-radius: 16px;
				background: var(--md-sys-color-background);
				color: var(--md-sys-color-on-background, #202b3c);
				font-family: Roboto, Arial, sans-serif;
				text-align: center;
			}
			#haven-boot-error[hidden] {
				display: none;
			}
			#haven-boot-error h1 {
				margin: 0 0 12px;
				font-size: 18px;
				font-weight: 600;
			}
			#haven-boot-error p {
				margin: 0 0 20px;
				font-size: 14px;
				line-height: 1.6;
				opacity: 0.8;
			}
			#haven-boot-retry {
				min-height: 40px;
				padding: 0 18px;
				border: 0;
				border-radius: 999px;
				background: var(--md-sys-color-primary);
				color: var(--md-sys-color-on-primary, #fff);
				font: inherit;
				font-size: 14px;
				cursor: pointer;
			}
			#haven-boot-retry:focus-visible {
				outline: 2px solid var(--md-sys-color-primary);
				outline-offset: 3px;
			}
			.boot-loading-bars {
				display: inline-flex;
				align-items: center;
				gap: 4px;
				height: 32px;
			}
			.boot-loading-bar {
				display: block;
				width: 5px;
				border-radius: 999px;
				background: var(--md-sys-color-primary);
				animation: haven-loading-float 1.2s ease-in-out infinite;
			}
			.boot-loading-bar--short {
				height: 14px;
				animation-delay: -0.16s;
			}
			.boot-loading-bar--tall {
				height: 24px;
				animation-delay: 0s;
			}
			.boot-loading-bar--medium {
				height: 18px;
				animation-delay: 0.16s;
			}
			@keyframes haven-loading-float {
				0%,
				100% {
					opacity: 0.5;
					transform: translateY(4px);
				}
				50% {
					opacity: 1;
					transform: translateY(-4px);
				}
			}
		</style>
		%sveltekit.head%
	</head>
	<body>
		<!-- Removed by +layout.svelte after the hydrated app has painted. -->
		<div
			id="haven-boot"
			role="status"
			aria-live="polite"
			aria-busy="true"
			aria-label="正在加载"
		>
			<div class="boot-loading-bars" aria-hidden="true">
				<span class="boot-loading-bar boot-loading-bar--short"></span>
				<span class="boot-loading-bar boot-loading-bar--tall"></span>
				<span class="boot-loading-bar boot-loading-bar--medium"></span>
			</div>
			<section id="haven-boot-error" hidden>
				<h1>Haven 启动遇到问题</h1>
				<p>界面未能完成加载。可以重新加载；如果仍然失败，请从系统托盘退出 Haven 后重新启动。</p>
				<button id="haven-boot-retry" type="button">重新加载</button>
			</section>
		</div>
		<script>
			(function () {
				window.setTimeout(function () {
					var boot = document.getElementById('haven-boot');
					if (!boot || !boot.isConnected) return;
					var loading = boot.querySelector('.boot-loading-bars');
					var failure = document.getElementById('haven-boot-error');
					if (loading) loading.hidden = true;
					if (failure) failure.hidden = false;
					boot.setAttribute('role', 'alert');
					boot.setAttribute('aria-live', 'assertive');
					boot.setAttribute('aria-busy', 'false');
					boot.setAttribute('aria-label', 'Haven 启动遇到问题');
				}, 30000);
				document.addEventListener('click', function (event) {
					var target = event.target;
					if (target instanceof Element && target.closest('#haven-boot-retry')) {
						window.location.reload();
					}
				});
			})();
		</script>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
