<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="dark light" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<title>Haven</title>
		<script>
			(function() {
				// First-paint fallback only: the persisted theme/accent live in
				// config.toml (loaded via get_settings after mount). Until that
				// arrives, use the OS color scheme so the first frame never
				// flashes an unreadable page.
				var theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
				document.documentElement.setAttribute('data-theme', theme);
				(function() {
					var hex = '#2C5090'; /* info蓝 default */
					document.documentElement.style.setProperty('--md-accent-hex', hex);
				})();
			})();
		</script>
		%sveltekit.head%
	</head>
	<body>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
