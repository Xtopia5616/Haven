<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="dark light" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<link
			rel="preload"
			href="%sveltekit.assets%/fonts/roboto/latin-400-normal.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<link
			rel="preload"
			href="%sveltekit.assets%/fonts/jetbrains-mono/latin-400-normal.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<title>Haven</title>
		<script>
			(function() {
				// The theme / accent persist in localStorage (frontend-only), so
				// they can be applied synchronously on this blocking script and
				// the first paint is always correct — no wait for get_settings.
				function read(k) {
					try { return window.localStorage.getItem(k); } catch (e) { return null; }
				}
				var theme = read('haven.theme');
				if (theme !== 'light' && theme !== 'dark') {
					theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
				}
				document.documentElement.setAttribute('data-theme', theme);
				var accent = read('haven.accent');
				// Preset hexes are mirrored from themeStore.ts's ACCENT_PRESETS —
				// keep this table in sync when adding/renaming presets.
				var hex = '#2C5090'; /* info蓝 default */
				if (accent === 'green') hex = '#006548';
				else if (accent === 'red') hex = '#C82910';
				else if (accent && accent.indexOf('custom:') === 0) {
					var c = accent.slice(7);
					if (/^#[0-9a-f]{6}$/i.test(c)) hex = c;
				}
				document.documentElement.setAttribute('data-accent', accent || 'blue');
				document.documentElement.style.setProperty('--md-accent-hex', hex);
				// Match app.css surface tokens so the boot shell and hydrated
				// chrome share one background (also matches tauri.conf dark).
				document.documentElement.style.background =
					theme === 'light' ? '#faf8ff' : '#121318';
			})();
		</script>
		<style>
			/*
			 * First-paint boot shell — mirrors +layout titlebar tokens from
			 * app.css / Logo.svelte / StatusDot so the swap on mount is quiet.
			 * No external CSS; must paint before Svelte hydrates.
			 */
			:root, [data-theme='light'] {
				--boot-mark-background: #2C5090;
				--boot-mark-bubble: #D7E3FF;
				--boot-mark-ink: #2C5090;
				--boot-bg: #faf8ff;
				--boot-on: #1a1b22;
				--boot-on-variant: #46464f;
				--boot-titlebar: #eeecf3;
				--boot-chip: #e8e7ee;
				--boot-primary: var(--md-accent-hex, #2C5090);
				--boot-outline-dot: #777680;
			}
			[data-theme='dark'] {
				--boot-bg: #121318;
				--boot-on: #e3e2e9;
				--boot-on-variant: #c7c5d0;
				--boot-titlebar: #1e1f26;
				--boot-chip: #292a31;
				--boot-primary: color-mix(in srgb, var(--md-accent-hex, #2C5090) 55%, #ffffff);
				--boot-outline-dot: #90909a;
			}
			html, body {
				margin: 0;
				height: 100%;
				background: var(--boot-bg);
				color: var(--boot-on);
			}
			#haven-boot {
				position: fixed;
				inset: 0;
				z-index: 9999;
				display: flex;
				flex-direction: column;
				background: var(--boot-bg);
				color: var(--boot-on);
				font-family: 'Roboto', 'Segoe UI', 'Segoe UI Variable Text',
					'Segoe UI Variable', 'Microsoft YaHei UI', 'Microsoft YaHei',
					'Microsoft JhengHei UI', 'Microsoft JhengHei', 'PingFang SC',
					'PingFang TC', 'Hiragino Sans GB', 'Noto Sans SC',
					'Noto Sans TC', 'Helvetica Neue', Arial, sans-serif;
				-webkit-font-smoothing: antialiased;
			}
			#haven-boot .boot-bar {
				height: 52px;
				display: flex;
				align-items: center;
				justify-content: space-between;
				padding: 0 16px;
				background: var(--boot-titlebar);
				flex-shrink: 0;
				-webkit-app-region: drag;
			}
			#haven-boot .boot-brand {
				display: inline-flex;
				align-items: center;
				gap: 8px;
				line-height: 1;
			}
			#haven-boot .boot-glyph {
				display: inline-flex;
				width: 22px;
				height: 22px;
			}
			#haven-boot .boot-wordmark {
				font-family: 'Roboto', 'Segoe UI Display',
					'Segoe UI Variable Display', 'Segoe UI Variable',
					'Microsoft YaHei UI', 'Microsoft YaHei',
					'Microsoft JhengHei UI', 'Microsoft JhengHei', 'PingFang SC',
					'PingFang TC', sans-serif;
				font-size: 16px;
				font-weight: 700;
				letter-spacing: 0.4px;
				color: var(--boot-primary);
			}
			#haven-boot .boot-chip {
				display: inline-flex;
				align-items: center;
				gap: 8px;
				height: 32px;
				padding: 0 12px;
				border-radius: 8px;
				background: var(--boot-chip);
				color: var(--boot-on-variant);
				font-size: 12px;
				font-weight: 600;
				border: none;
				-webkit-app-region: no-drag;
			}
			#haven-boot .boot-dot {
				display: inline-flex;
				width: 16px;
				height: 16px;
				flex-shrink: 0;
				animation: haven-boot-pulse 1.2s cubic-bezier(0.2, 0, 0, 1) infinite;
			}
			#haven-boot .boot-dot svg {
				display: block;
				width: 16px;
				height: 16px;
			}
			#haven-boot .boot-main {
				flex: 1;
				background: var(--boot-bg);
			}
			@keyframes haven-boot-pulse {
				0%, 100% { opacity: 1; transform: scale(1); }
				50% { opacity: 0.35; transform: scale(0.85); }
			}
		</style>
		%sveltekit.head%
	</head>
	<body>
		<!-- Instant chrome: mirrors the real titlebar so hydration swap is quiet.
		     Removed by +layout.svelte onMount once the live layout mounts. -->
		<div id="haven-boot" role="status" aria-live="polite" aria-busy="true">
			<div class="boot-bar">
				<span class="boot-brand">
					<span class="boot-glyph" aria-hidden="true">
						<svg viewBox="0 0 64 64" width="22" height="22" fill="none">
							<rect x="2" y="2" width="60" height="60" rx="18" fill="var(--boot-mark-background)" />
							<path
								d="M18 15h28c5.523 0 10 4.477 10 10v11c0 5.523-4.477 10-10 10H32L21 54v-8h-3c-5.523 0-10-4.477-10-10V25c0-5.523 4.477-10 10-10Z"
								fill="var(--boot-mark-bubble)"
							/>
							<g fill="var(--boot-mark-ink)">
								<rect x="24" y="24.5" width="5" height="12" rx="2.5" />
								<rect x="29.5" y="21.5" width="5" height="18" rx="2.5" />
								<rect x="35" y="24.5" width="5" height="12" rx="2.5" />
							</g>
						</svg>
					</span>
					<span class="boot-wordmark">Haven</span>
				</span>
				<span class="boot-chip">
					<span class="boot-dot" aria-hidden="true">
						<svg viewBox="0 0 64 64" width="16" height="16" fill="none">
							<rect x="2" y="2" width="60" height="60" rx="18" fill="var(--boot-mark-background)" />
							<rect
								x="2"
								y="2"
								width="60"
								height="60"
								rx="18"
								fill="none"
								stroke="var(--boot-outline-dot)"
								stroke-width="4"
							/>
							<path
								d="M18 15h28c5.523 0 10 4.477 10 10v11c0 5.523-4.477 10-10 10H32L21 54v-8h-3c-5.523 0-10-4.477-10-10V25c0-5.523 4.477-10 10-10Z"
								fill="var(--boot-mark-bubble)"
							/>
							<g fill="var(--boot-mark-ink)">
								<rect x="24" y="24.5" width="5" height="12" rx="2.5" />
								<rect x="29.5" y="21.5" width="5" height="18" rx="2.5" />
								<rect x="35" y="24.5" width="5" height="12" rx="2.5" />
							</g>
						</svg>
					</span>
					加载中
				</span>
			</div>
			<div class="boot-main"></div>
		</div>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
