<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="dark light" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<link
			rel="preload"
			href="%sveltekit.assets%/fonts/roboto/latin-400-normal.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<link
			rel="preload"
			href="%sveltekit.assets%/fonts/jetbrains-mono/latin-400-normal.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<title>Haven</title>
		<script>
			(function () {
				// The theme / accent persist in localStorage (frontend-only), so
				// they can be applied synchronously on this blocking script and
				// the first paint is always correct — no wait for get_settings.
				function read(k) {
					try {
						return window.localStorage.getItem(k);
					} catch (e) {
						return null;
					}
				}
				var theme = read('haven.theme');
				if (theme !== 'light' && theme !== 'dark') {
					theme = window.matchMedia('(prefers-color-scheme: dark)').matches
						? 'dark'
						: 'light';
				}
				document.documentElement.setAttribute('data-theme', theme);
				var accent = read('haven.accent');
				// Preset hexes are mirrored from themeStore.ts's ACCENT_PRESETS —
				// keep this table in sync when adding/renaming presets.
				var hex = '#2C5090'; /* info蓝 default */
				if (accent === 'green') hex = '#006548';
				else if (accent === 'red') hex = '#C82910';
				else if (accent && accent.indexOf('custom:') === 0) {
					var c = accent.slice(7);
					if (/^#[0-9a-f]{6}$/i.test(c)) hex = c;
				}
				document.documentElement.setAttribute('data-accent', accent || 'blue');
				document.documentElement.style.setProperty('--md-accent-hex', hex);
				// Match app.css surface tokens so the boot shell and hydrated
				// chrome share one background (also matches tauri.conf dark).
				document.documentElement.style.background =
					theme === 'light' ? '#f7f8fc' : '#181b24';
			})();
		</script>
		<style>
			/*
			 * First-paint boot shell — mirrors +layout titlebar tokens from
			 * app.css / Logo.svelte / StatusDot so the swap on mount is quiet.
			 * No external CSS; must paint before Svelte hydrates.
			 */
			:root,
			[data-theme='light'] {
				--haven-mark-bubble: #d7e3ff;
				--haven-mark-ink: #2c5090;
				--md-sys-color-background: #f7f8fc;
				--md-sys-color-surface: #f7f8fc;
				--md-sys-color-on-surface: #1a1b22;
				--md-sys-color-on-surface-variant: #46464f;
				--md-sys-color-surface-container-low: #f1f3f8;
				--md-sys-color-surface-container: #e9edf4;
				--md-sys-color-surface-container-high: #e1e6ef;
				--md-sys-color-surface-container-highest: #d9dfe9;
				--md-sys-color-primary: var(--md-accent-hex, #2c5090);
				--md-sys-color-on-primary: #ffffff;
				--md-sys-color-titlebar: color-mix(
					in srgb,
					var(--md-sys-color-surface-container-low) 92%,
					var(--md-sys-color-primary) 8%
				);
				--md-sys-color-outline: #777680;
				--md-sys-color-outline-variant: #c3c9d5;
			}
			[data-theme='dark'] {
				--haven-mark-bubble: #d7e3ff;
				--haven-mark-ink: #2c5090;
				--md-sys-color-background: #181b24;
				--md-sys-color-surface: #181b24;
				--md-sys-color-on-surface: #e3e2e9;
				--md-sys-color-on-surface-variant: #c7c5d0;
				--md-sys-color-surface-container-low: #1d2029;
				--md-sys-color-surface-container: #222631;
				--md-sys-color-surface-container-high: #292e3b;
				--md-sys-color-surface-container-highest: #303646;
				--md-sys-color-primary: color-mix(
					in srgb,
					var(--md-accent-hex, #2c5090) 55%,
					#ffffff
				);
				--md-sys-color-on-primary: #1a1b22;
				--md-sys-color-titlebar: color-mix(
					in srgb,
					var(--md-sys-color-surface-container-high) 92%,
					var(--md-sys-color-primary) 8%
				);
				--md-sys-color-outline: #9b9ba6;
				--md-sys-color-outline-variant: #414754;
			}
			:root,
			[data-theme='light'],
			[data-theme='dark'] {
				--md-comp-titlebar-height: 56px;
				--md-comp-status-height: 40px;
				--md-comp-status-padding-inline: 12px;
				--md-comp-status-radius: 12px;
			}
			html,
			body {
				margin: 0;
				height: 100%;
				background: var(--md-sys-color-background);
				color: var(--md-sys-color-on-surface);
			}
			#haven-boot {
				position: fixed;
				inset: 0;
				z-index: 9999;
				display: flex;
				flex-direction: column;
				background: var(--md-sys-color-background);
				color: var(--md-sys-color-on-surface);
				font-family:
					'Roboto', 'Segoe UI', 'Segoe UI Variable Text', 'Segoe UI Variable',
					'Microsoft YaHei UI', 'Microsoft YaHei', 'Microsoft JhengHei UI',
					'Microsoft JhengHei', 'PingFang SC', 'PingFang TC', 'Hiragino Sans GB',
					'Noto Sans SC', 'Noto Sans TC', 'Helvetica Neue', Arial, sans-serif;
				-webkit-font-smoothing: antialiased;
			}
			#haven-boot,
			#haven-boot * {
				box-sizing: border-box;
			}
			#haven-boot .boot-bar {
				height: var(--md-comp-titlebar-height);
				display: flex;
				align-items: center;
				justify-content: space-between;
				padding: 0 20px;
				background: var(--md-sys-color-titlebar);
				border-bottom: 1px solid var(--md-sys-color-outline-variant);
				flex-shrink: 0;
				-webkit-app-region: drag;
			}
			#haven-boot .boot-brand {
				display: inline-flex;
				align-items: center;
				gap: 8px;
				line-height: 1;
			}
			#haven-boot .boot-glyph {
				display: inline-flex;
				width: 22px;
				height: 22px;
			}
			#haven-boot .boot-wordmark {
				font-family:
					'Roboto', 'Segoe UI Display', 'Segoe UI Variable Display', 'Segoe UI Variable',
					'Microsoft YaHei UI', 'Microsoft YaHei', 'Microsoft JhengHei UI',
					'Microsoft JhengHei', 'PingFang SC', 'PingFang TC', sans-serif;
				font-size: 16px;
				font-weight: 700;
				letter-spacing: 0.4px;
				color: var(--md-sys-color-primary);
			}
			#haven-boot .boot-chip {
				display: inline-flex;
				align-items: center;
				gap: 8px;
				height: var(--md-comp-status-height);
				min-width: 48px;
				padding: 0 var(--md-comp-status-padding-inline);
				border-radius: var(--md-comp-status-radius);
				background: var(--md-sys-color-surface-container-high);
				color: var(--md-sys-color-on-surface-variant);
				font-size: 12px;
				font-weight: 600;
				letter-spacing: 0.1px;
				line-height: 1.45;
				border: 1px solid var(--md-sys-color-outline-variant);

			}
			#haven-boot .boot-actions {
				display: inline-flex;
				align-items: center;
				gap: 8px;
				-webkit-app-region: no-drag;
			}
			#haven-boot .boot-theme {
				display: inline-flex;
				align-items: center;
				justify-content: center;
				width: 40px;
				height: 40px;
				border-radius: var(--md-comp-status-radius);
				color: var(--md-sys-color-on-surface-variant);
			}
			#haven-boot .boot-theme svg {
				display: block;
				width: 18px;
				height: 18px;
			}
			#haven-boot .boot-theme-icon--sun {
				display: none;
			}
			[data-theme='dark'] #haven-boot .boot-theme-icon--sun {
				display: block;
			}
			[data-theme='dark'] #haven-boot .boot-theme-icon--moon {
				display: none;
			}
			#haven-boot .boot-dot {
				display: inline-block;
				width: 8px;
				height: 8px;
				border-radius: 50%;
				background: var(--md-sys-color-outline);
				flex-shrink: 0;
				animation: haven-boot-pulse 1.2s cubic-bezier(0.2, 0, 0, 1) infinite;
			}
			#haven-boot .boot-main {
				flex: 1;
				display: flex;
				flex-direction: column;
				min-height: 0;
				background: var(--md-sys-color-background);
			}
			#haven-boot .boot-nav {
				display: grid;
				grid-template-columns: repeat(5, minmax(0, 1fr));
				align-items: stretch;
				height: 56px;
				padding: 6px 20px;
				gap: 4px;
				background: var(--md-sys-color-surface);
				border-bottom: 1px solid var(--md-sys-color-outline-variant);
				flex-shrink: 0;
			}
			#haven-boot .boot-tab {
				position: relative;
				display: inline-flex;
				align-items: center;
				justify-content: center;
				gap: 8px;
				min-width: 0;
				border-radius: 12px;
				color: var(--md-sys-color-on-surface-variant);
				font-size: 13px;
				font-weight: 600;
				line-height: 1.5;
			}
			#haven-boot .boot-tab svg {
				display: block;
				width: 17px;
				height: 17px;
				flex-shrink: 0;
			}
			#haven-boot .boot-tab--active {
				color: var(--md-sys-color-primary);
			}
			#haven-boot .boot-tab--active::after {
				content: '';
				position: absolute;
				left: 50%;
				bottom: -6px;
				width: 24px;
				height: 3px;
				transform: translateX(-50%);
				border-radius: 999px;
				background: var(--md-sys-color-primary);
			}
			#haven-boot .boot-session {
				display: flex;
				align-items: center;
				justify-content: space-between;
				gap: 16px;
				min-height: 72px;
				padding: 12px 24px;
				background: color-mix(
					in srgb,
					var(--md-sys-color-surface-container-low) 92%,
					var(--md-sys-color-primary) 8%
				);
				border-bottom: 1px solid var(--md-sys-color-outline-variant);
				flex-shrink: 0;
			}
			#haven-boot .boot-session-identity {
				display: flex;
				flex-direction: column;
				align-items: flex-start;
				gap: 4px;
				min-width: 0;
			}
			#haven-boot .boot-eyebrow {
				display: inline-flex;
				align-items: center;
				gap: 4px;
				color: var(--md-sys-color-on-surface-variant);
				font-size: 11px;
				font-weight: 600;
				line-height: 1.4;
			}
			#haven-boot .boot-eyebrow::before {
				content: '';
				width: 6px;
				height: 6px;
				border-radius: 999px;
				background: var(--md-sys-color-primary);
			}
			#haven-boot .boot-session-title-row {
				display: flex;
				align-items: center;
				gap: 12px;
				min-width: 0;
			}
			#haven-boot .boot-session-title {
				color: var(--md-sys-color-on-surface);
				font-size: 18px;
				font-weight: 700;
				line-height: 1.35;
			}
			#haven-boot .boot-session-status {
				padding: 0;
				border: 0;
				color: var(--md-sys-color-on-surface-variant);
				font-size: 11px;
				line-height: 1.4;
				white-space: nowrap;
			}
			#haven-boot .boot-session-new {
				display: grid;
				place-items: center;
				width: 40px;
				height: 40px;
				border: 1px solid var(--md-sys-color-outline-variant);
				border-radius: 12px;
				color: var(--md-sys-color-on-surface-variant);
				font-size: 26px;
				font-weight: 300;
				line-height: 1;
			}
			#haven-boot .boot-chat {
				display: flex;
				flex: 1;
				flex-direction: column;
				min-height: 0;
				background: var(--md-sys-color-surface);
				background-image: linear-gradient(
					180deg,
					color-mix(in srgb, var(--md-sys-color-primary) 3%, transparent),
					transparent 240px
				);
			}
			#haven-boot .boot-messages {
				display: flex;
				flex: 1;
				align-items: center;
				justify-content: center;
				min-height: 0;
				padding: 24px 16px;
			}
			#haven-boot .boot-loading {
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 12px;
				min-height: 220px;
				text-align: center;
				color: var(--md-sys-color-on-surface-variant);
			}
			#haven-boot .boot-loading-visual {
				position: relative;
				display: grid;
				place-items: center;
				width: 80px;
				height: 72px;
			}
			#haven-boot .boot-loading-halo {
				position: absolute;
				width: 64px;
				height: 64px;
				border: 1px solid color-mix(in srgb, var(--md-sys-color-primary) 26%, transparent);
				border-radius: 22px;
				animation: haven-loading-halo 1.8s cubic-bezier(0.2, 0, 0, 1) infinite;
			}
			#haven-boot .boot-loading-mark {
				position: relative;
				z-index: 1;
				display: grid;
				place-items: center;
				width: 52px;
				height: 52px;
				border: 1px solid color-mix(in srgb, var(--md-sys-color-primary) 20%, transparent);
				border-radius: 18px;
				background: var(--md-sys-color-surface-container-high);
				box-shadow: 0 2px 8px color-mix(in srgb, #000 18%, transparent);
				animation: haven-loading-mark 1.8s cubic-bezier(0.2, 0, 0, 1) infinite;
			}
			#haven-boot .boot-loading-mark svg {
				display: block;
				width: 34px;
				height: 34px;
			}
			#haven-boot .boot-loading-bars {
				position: absolute;
				bottom: 1px;
				z-index: 2;
				display: inline-flex;
				align-items: flex-end;
				gap: 3px;
				padding: 4px 6px;
				border: 1px solid var(--md-sys-color-outline-variant);
				border-radius: 999px;
				background: var(--md-sys-color-surface-container);
				box-shadow: 0 2px 6px color-mix(in srgb, #000 18%, transparent);
			}
			#haven-boot .boot-loading-bar {
				display: block;
				width: 4px;
				border-radius: 999px;
				background: var(--md-sys-color-primary);
				transform-origin: bottom;
				animation: haven-loading-bar 1.1s cubic-bezier(0.2, 0, 0, 1) infinite;
			}
			#haven-boot .boot-loading-bar--short {
				height: 8px;
				animation-delay: -0.28s;
			}
			#haven-boot .boot-loading-bar--tall {
				height: 14px;
				animation-delay: -0.08s;
			}
			#haven-boot .boot-loading-bar--medium {
				height: 10px;
				animation-delay: 0.12s;
			}
			#haven-boot .boot-loading-copy {
				display: flex;
				flex-direction: column;
				gap: 2px;
			}
			#haven-boot .boot-loading-label {
				color: var(--md-sys-color-on-surface);
				font-size: 16px;
				font-weight: 600;
				line-height: 1.4;
			}
			#haven-boot .boot-loading-detail {
				font-size: 13px;
				line-height: 1.5;
				color: var(--md-sys-color-on-surface-variant);
			}
			#haven-boot .boot-composer {
				display: flex;
				flex-shrink: 0;
				flex-direction: column;
				gap: 4px;
				width: min(800px, calc(100% - 32px));
				min-height: 116px;
				margin: 0 auto 12px;
				padding: 8px 16px;
				border: 1px solid var(--md-sys-color-outline-variant);
				border-radius: 16px;
				background: var(--md-sys-color-surface-container-low);
				box-shadow: 0 1px 3px var(--md-sys-color-shadow, rgba(0, 0, 0, 0.18));
			}
			#haven-boot .boot-input-row {
				display: flex;
				align-items: center;
				min-height: 48px;
				padding: 0 8px;
				color: var(--md-sys-color-on-surface-variant);
				font-size: 14px;
				line-height: 1.55;
			}
			#haven-boot .boot-toolbar {
				display: flex;
				align-items: center;
				justify-content: space-between;
				gap: 8px;
				padding-top: 4px;
				border-top: 1px solid var(--md-sys-color-outline-variant);
			}
			#haven-boot .boot-toolbar-group {
				display: flex;
				align-items: center;
				gap: 8px;
			}
			#haven-boot .boot-control,
			#haven-boot .boot-token {
				display: inline-flex;
				align-items: center;
				justify-content: center;
				width: 40px;
				height: 40px;
				border: 1px solid var(--md-sys-color-outline-variant);
				border-radius: 12px;
				color: var(--md-sys-color-on-surface-variant);
				font-size: 20px;
				line-height: 1;
			}
			#haven-boot .boot-token {
				width: 84px;
				justify-content: flex-start;
				padding: 0 12px;
				font-size: 13px;
			}
			#haven-boot .boot-send {
				background: var(--md-sys-color-primary);
				border-color: var(--md-sys-color-primary);
				color: var(--md-sys-color-on-primary);
			}
			#haven-boot .boot-send::before {
				content: '↑';
			}
			#haven-boot .boot-control--plus::before {
				content: '+';
			}
			#haven-boot .boot-control--attach::before {
				content: '⌕';
				transform: rotate(-35deg);
			}
			#haven-boot .boot-control--mic::before {
				content: '♩';
			}
			#haven-boot .boot-control--model::before {
				content: '▣';
				font-size: 14px;
			}
			@media (max-width: 640px) {
				#haven-boot .boot-bar {
					padding-inline: 12px;
				}
				#haven-boot .boot-session {
					align-items: flex-start;
					min-height: 95px;
					padding: 12px 16px;
				}
				#haven-boot .boot-session-title-row {
					align-items: flex-start;
					flex-direction: column;
					gap: 4px;
				}
				#haven-boot .boot-nav {
					padding-inline: 12px;
				}
				#haven-boot .boot-tab {
					gap: 4px;
					font-size: 12px;
				}
				#haven-boot .boot-tab svg {
					width: 16px;
					height: 16px;
				}
				#haven-boot .boot-composer {
					min-height: 164px;
				}
			}
			@media (max-width: 455px) {
				#haven-boot .boot-toolbar {
					align-items: flex-start;
					flex-wrap: wrap;
				}
				#haven-boot .boot-toolbar-group {
					flex: 1 1 auto;
				}
				#haven-boot .boot-toolbar-group:last-child {
					justify-content: flex-end;
					width: 100%;
				}

			@keyframes haven-boot-pulse {
				0%,
				100% {
					opacity: 1;
					transform: scale(1);
				}
				50% {
					opacity: 0.35;
					transform: scale(0.85);
				}
			}
			@keyframes haven-loading-halo {
				0%,
				100% {
					opacity: 0.45;
					transform: scale(0.92);
				}
				50% {
					opacity: 1;
					transform: scale(1.02);
				}
			}
			@keyframes haven-loading-mark {
				0%,
				100% {
					transform: translateY(1px);
				}
				50% {
					transform: translateY(-1px);
				}
			}
			@keyframes haven-loading-bar {
				0%,
				100% {
					opacity: 0.5;
					transform: scaleY(0.58);
				}
				50% {
					opacity: 1;
					transform: scaleY(1);
				}

				#haven-boot .boot-loading-halo,
				#haven-boot .boot-loading-mark,
				#haven-boot .boot-loading-bar {
					animation: none;
				}
			}
		</style>
		%sveltekit.head%
	</head>
	<body>
		<!-- Instant chrome: mirrors the real titlebar so hydration swap is quiet.
		     Removed by +layout.svelte onMount once the live layout mounts. -->
		<div id="haven-boot" role="status" aria-live="polite" aria-busy="true">
			<div class="boot-bar">
				<span class="boot-brand">
					<span class="boot-glyph" aria-hidden="true">
						<svg viewBox="0 0 64 64" width="22" height="22" fill="none">
							<path
								d="M18 15h28c5.523 0 10 4.477 10 10v11c0 5.523-4.477 10-10 10H32L21 54v-8h-3c-5.523 0-10-4.477-10-10V25c0-5.523 4.477-10 10-10Z"
								fill="var(--haven-mark-bubble)"
							/>
							<g fill="var(--haven-mark-ink)">
								<rect x="24" y="24.5" width="5" height="12" rx="2.5" />
								<rect x="29.5" y="21.5" width="5" height="18" rx="2.5" />
								<rect x="35" y="24.5" width="5" height="12" rx="2.5" />
							</g>
						</svg>
					</span>
					<span class="boot-wordmark">Haven</span>
				</span>
				<span class="boot-actions">
					<span class="boot-chip">
						<span class="boot-dot" aria-hidden="true"></span>
						加载中
